name: Feature or tool request
description: A new capability, tool, or sub-agent
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What task should the agent be able to do?
      description: A concrete example prompt and the result you expect.
    validations: { required: true }
  - type: textarea
    id: approach
    attributes:
      label: Proposed tool or approach
      description: Name, tool group, and side-effect level (read / write / irreversible).
  - type: textarea
    id: evals
    attributes:
      label: Eval tasks that would cover it
      description: New capabilities enter with 3-5 eval tasks.
