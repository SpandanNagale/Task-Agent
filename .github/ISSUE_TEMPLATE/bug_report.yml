name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, task prompt, and config (remove any keys).
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: "`task-agent version` and OS"
  - type: textarea
    id: logs
    attributes:
      label: Logs or trace id
      render: text
