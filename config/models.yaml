# Model roles -> fallback chains. Code asks for a role, never a model id.
#
# Each chain entry is passed to LiteLLM (any LiteLLM param works: api_base, max_tokens, ...).
# ${VAR} reads the environment; ${VAR:-default} supplies a fallback. An entry that needs an
# unset variable is skipped, so you only need keys for the providers you actually use.
# Run `task-agent models` to see what resolved.
#
# Model ids change fast: check each provider's current catalogue and update freely.

defaults:
  timeout_s: 60
  num_retries: 1   # per model, before falling through to the next entry
  cooldown_s: 30   # skip a model this long after repeated failures

roles:
  planner:
    description: Writes and revises plans. Use the strongest model you can afford.
    timeout_s: 180
    params: { temperature: 0.2 }
    chain:
      - name: ollama-cloud
        model: ollama_chat/${PLANNER_OLLAMA_CLOUD_MODEL:-gpt-oss:120b}
        api_base: https://ollama.com
        api_key: ${OLLAMA_API_KEY}
      - name: openrouter
        model: openrouter/${PLANNER_OPENROUTER_MODEL:-qwen/qwen3-235b-a22b-2507}
        api_key: ${OPENROUTER_API_KEY}
      - name: gemini
        model: gemini/${PLANNER_GEMINI_MODEL:-gemini-2.5-flash}
        api_key: ${GEMINI_API_KEY}
      - name: groq
        model: groq/${PLANNER_GROQ_MODEL:-llama-3.3-70b-versatile}
        api_key: ${GROQ_API_KEY}

  worker:
    description: Executes individual steps. Local 7-14B model first, hosted fallback.
    timeout_s: 120
    params: { temperature: 0.2 }
    chain:
      - name: ollama-local
        model: ollama_chat/${WORKER_LOCAL_MODEL:-qwen3:14b}
        api_base: ${OLLAMA_BASE_URL}
      - name: ollama-cloud
        model: ollama_chat/${WORKER_OLLAMA_CLOUD_MODEL:-gpt-oss:20b}
        api_base: https://ollama.com
        api_key: ${OLLAMA_API_KEY}
      - name: groq
        model: groq/${WORKER_GROQ_MODEL:-llama-3.1-8b-instant}
        api_key: ${GROQ_API_KEY}

  router:
    description: Cheap, fast classification (tool-group routing, yes/no checks).
    alias: worker
    params: { temperature: 0 }

  judge:
    description: Grades eval answers against rubrics. Keep it fixed between runs you compare.
    alias: planner
    params: { temperature: 0 }
